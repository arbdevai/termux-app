name: Release APK (Android 14 ARM64)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TERMUX_PACKAGE_VARIANT: apt-android-7
      TERMUX_APP_VERSION_NAME: 0.118.0+${{ github.sha }}
      TERMUX_APP_VERSION_CODE: 121
      TERMUX_APK_VERSION_TAG: ${{ github.sha }}-android14-arm64-release
      RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/app/testkey_untrusted.jks
      RELEASE_KEYSTORE_PASSWORD: xrj45yWGLbsO7W0v
      RELEASE_KEY_PASSWORD: xrj45yWGLbsO7W0v
      RELEASE_KEY_ALIAS: alias

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17 and restore Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore verified ARM64 bootstrap cache
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/bootstrap-aarch64.zip
          key: termux-bootstrap-android7-2026.02.12-r1-arm64

      - name: Prepare release signing key
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_PASSWORD" || { echo "Release keystore password is missing"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Release key password is missing"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Release key alias is missing"; exit 1; }
          test -f "$RELEASE_KEYSTORE_PATH" || { echo "Bundled Termux-compatible keystore is missing"; exit 1; }

      - name: Compile and assemble signed release APK
        run: ./gradlew --no-daemon --parallel --max-workers=2 :app:compileReleaseJavaWithJavac :app:assembleRelease -x :app:lintVitalRelease

      - name: Verify release signature and prepare artifact
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose "$apk_path"
          mkdir -p handoff
          cp "$apk_path" handoff/
          (cd handoff && sha256sum ./*.apk > SHA256SUMS)

      - name: Upload signed release APK
        uses: actions/upload-artifact@v6
        with:
          name: termux-android14-arm64-release-${{ github.sha }}
          path: handoff/
          if-no-files-found: error
          retention-days: 30
